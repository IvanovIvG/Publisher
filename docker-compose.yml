version: '3.8'
services:
  backend:
    image: backend:0.0.1
    container_name: backend
    build:
      context: ./BackEnd
    ports:
      - "8080:8080"
    depends_on:
      - database
    environment:
      - SERVER_PORT= 8080
      - SPRING_DATASOURCE_URL=jdbc:postgresql://database/publisher
  security:
    image: security:0.0.1
    container_name: security
    build:
      context: ./SecurityServer
    ports:
      - "9090:9090"
    environment:
      - SERVER_PORT= 9090
  database:
    image: postgres:14.7-alpine
    container_name: database
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: PathNotFind
    ports:
      - "5432:5432"
    volumes:
      - ./infrastructure/db/create_db.sql:/docker-entrypoint-initdb.d/create_db.sql
      - db-data:/var/lib/postgresql/data
    restart: unless-stopped
volumes:
  db-data: